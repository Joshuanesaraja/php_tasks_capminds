<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AJAX Patient Appointment</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Page Heading -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">Patient Appointment Management</h1>
            <p class="text-muted">
                Manage patient appointments without page reload
            </p>
        </div>


        <!-- Appointment Form -->
        <div class="card shadow-sm mb-4">

            <div class="card-header bg-primary text-light">
                <h4 class="mb-0">Book Appointment</h4>
            </div>

            <div class="card-body">

                <form id="appointmentForm">

                    <!-- Hidden ID -->
                    <input type="hidden" id="appointmentId">


                    <div class="row g-3">

                        <!-- Patient Name -->
                        <div class="col-md-6">
                            <label for="patientName" class="form-label">
                                Patient Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="patientName"
                            >
                        </div>


                        <!-- Email -->
                        <div class="col-md-6">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                            >
                        </div>


                        <!-- Mobile -->
                        <div class="col-md-4">
                            <label for="mobile" class="form-label">
                                Mobile
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="mobile"
                            >
                        </div>


                        <!-- Appointment Date -->
                        <div class="col-md-4">
                            <label for="appointmentDate" class="form-label">
                                Appointment Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="appointmentDate"
                            >
                        </div>


                        <!-- Appointment Time -->
                        <div class="col-md-4">
                            <label for="appointmentTime" class="form-label">
                                Appointment Time
                            </label>

                            <input
                                type="time"
                                class="form-control"
                                id="appointmentTime"
                            >
                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="submitButton"
                        >
                            Book Appointment
                        </button>

                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="cancelButton"
                            style="display: none;"
                        >
                            Cancel Edit
                        </button>

                    </div>

                </form>

            </div>
        </div>


        <!-- Message -->
        <div id="message"></div>


        <!-- Appointment List -->
        <div class="card shadow-sm">

            <div class="card-header d-flex justify-content-between align-items-center bg-primary text-light">

                <h4 class="mb-0">Appointments</h4>

                <button
                    class="btn btn-light btn-sm"
                    onclick="loadAppointments()"
                >
                    Refresh
                </button>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover align-middle">

                        <thead class="table-primary">

                            <tr>
                                <th>ID</th>
                                <th>Patient</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="appointmentTableBody">

                            <!-- Appointments will be inserted here -->

                        </tbody>

                    </table>

                </div>

            </div>
        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
